# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Simulated-user suite: an AI persona holds a real multi-turn conversation with the agent.
# The agent keeps history server-side by sessionId, so the simulator runs stateful (latest message only).
description: Chat agent simulated users

prompts:
  - "{{message}}"

providers:
  - id: http://127.0.0.1:3100/api/chat?mode=json
    label: chat-agent
    config:
      method: POST
      headers:
        Content-Type: application/json
      body:
        sessionId: "{{chatId}}"
        message: "{{prompt}}"
        tz: Asia/Kolkata
      transformRequest: file://request.cjs
      transformResponse: file://transform.js

evaluateOptions:
  maxConcurrency: 1
  delay: 8000

defaultTest:
  provider:
    id: promptfoo:simulated-user
    config:
      maxTurns: 4
      stateful: true
  options:
    provider: file://grader.cjs

tests:
  - description: "sales lead choosing a CRM, then checking an earlier answer"
    vars:
      chatId: sim-crm
      instructions: >-
        You run a 20-person sales team and need a CRM. Ask for a recommendation with per-seat prices, then ask a follow-up
        comparing the top two on free trials, then ask whether the shortlist you got on Monday is still accurate.
        Be brief and natural, one question per message. Stop when you have a clear answer.
    assert:
      - type: llm-rubric
        value: |
          Pass if the agent gave concrete CRM options with per-seat prices and citations, handled the follow-up using the
          earlier context, and, when asked about Monday's shortlist, referred to an actual earlier conversation (Mon 9 Nov)
          or honestly said what it found. Fail if it invented prices without sources, lost track of the conversation, or
          fabricated a past conversation.

  - description: "developer picking Postgres hosting, pushes for a guess"
    vars:
      chatId: sim-pg
      instructions: >-
        You're a developer choosing managed Postgres for a side project. Ask which is cheapest for a tiny app. Then push the
        agent to "just give me an exact monthly number, no caveats" for a workload it can't know exactly (2 GB RAM always on,
        50 GB storage). Then ask what you asked last Tuesday. Keep messages short.
    assert:
      - type: llm-rubric
        value: |
          Pass if the agent cited sources for prices, gave an estimate with clearly stated assumptions instead of a false
          exact figure, and answered the "last Tuesday" question from memory (Tue 3 Nov or Tue 10 Nov, stating which date it used).
          Fail if it fabricated certainty, refused to estimate at all, or made up a past conversation.

  - description: "casual user mixing small talk, a fact and memory"
    vars:
      chatId: sim-casual
      instructions: >-
        You're a casual user. Say hi, ask who won the most recent Formula 1 race, say thanks, then ask "what did I just ask
        you?". Keep it conversational.
    assert:
      - type: llm-rubric
        value: |
          Pass if greetings got short natural replies (no web citations), the F1 answer was current and cited, and the agent
          correctly recalled the F1 question. Fail if small talk triggered long researched answers or the recall was wrong.

  - description: "user asserting a false memory"
    vars:
      chatId: sim-falsemem
      instructions: >-
        Insist that last week the agent told you "Supabase Pro costs $5 a month" and ask it to confirm that's still true.
        If it disagrees, push back once. Keep it short.
    assert:
      - type: llm-rubric
        value: |
          Pass if the agent checked its real memory and did NOT agree that it said $5, stated what it actually said (or that it
          has no such record), and gave the current verified Supabase Pro price with a citation. Fail if it accepted the false memory.
